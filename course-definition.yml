slug: firewall
name: Build your own Firewall
short_name: Firewall
release_status: alpha
description_md: Build an inbound HTTP firewall that protects a web application. Start with a working reverse proxy, then add attack rules, evasion handling, machine-learning scores, and resource limits. Finish by virtually patching a vulnerable endpoint while keeping legitimate requests working.
short_description_md: Stop web attacks without breaking legitimate traffic. Build a reverse proxy, add ML detection, and patch a vulnerable endpoint.
completion_percentage: 5
languages:
- slug: go
  release_status: alpha
- slug: python
  release_status: alpha
marketing:
  difficulty: hard
  sample_extension_idea_title: Inspect streaming responses
  sample_extension_idea_description: Extend response inspection to streams without releasing protected content.
  frequently_asked_questions:
  - question_markdown: What exactly will I build?
    answer_markdown: |-
      You'll build a web application firewall: a reverse proxy that sits between clients and a protected application.

      `client -> your firewall -> application server`

      Across ten stages, you'll extend the same program with attack rules, input normalization, rule and ML scores, request-body inspection, and response checks that withhold protected data.

      In the final stage, you'll virtually patch a vulnerable export endpoint. Your firewall will block requests for private fields before they reach the application, while keeping legitimate public-field exports working.
  - question_markdown: What exactly will I learn?
    answer_markdown: |-
      You'll learn how to:

      * Forward HTTP requests and responses through a reverse proxy.
      * Detect attack patterns in decoded inputs without changing the traffic you forward.
      * Combine weighted rule signals and ML scores, then tune thresholds for each application route.
      * Integrate a supplied pretrained detector with timeouts, result validation, and visible failure behavior.
      * Inspect structured request bodies and complete responses within size limits.
      * Write an endpoint-specific virtual patch for an application flaw that generic detectors can miss.

      You'll also see false positives and missed attacks, and test whether legitimate requests still work as you add each control.
  - question_markdown: Why should I build such a project?
    answer_markdown: |-
      A request can look harmless to an attack detector and still expose private application data. An aggressive rule can stop an attack and also block a legitimate user. Building your own firewall makes these tradeoffs concrete.

      You'll compare direct and protected application responses, see which requests reach the application, and investigate how rules, ML scores, and endpoint-specific checks affect the outcome. The final virtual patch shows how to protect a vulnerable endpoint without changing its application code.

      This is a learning implementation with a defined HTTP subset. You'll explore where inspection helps and why the application still needs its own validation and authorization.
  - question_markdown: What are the prerequisites for this challenge?
    answer_markdown: |-
      You should be comfortable writing Go or Python, working with HTTP and JSON, and using Git. No prior experience with web application firewalls or machine learning is required.

      You implement only the firewall. The tester starts the protected application and a supplied pretrained detector, and provides policies and dummy data. No separate application setup, model training, API key, or paid service is needed.

      The stages explain the security concepts as you go, but you'll work out the implementation yourself.
  testimonials: []
stages:
- slug: fi6
  name: Respond to health checks
  difficulty: very_easy
  marketing_md: In this stage, you'll start an HTTP server that answers health checks on port `8080`.
- slug: tf0
  name: Proxy web requests
  difficulty: easy
  marketing_md: In this stage, you'll forward HTTP requests and responses between a client and the protected application.
- slug: kg7
  name: Block and log
  difficulty: easy
  marketing_md: In this stage, you'll block matching attack rules or report their matches in log mode.
- slug: wt4
  name: Normalize request inputs
  difficulty: medium
  marketing_md: In this stage, you'll inspect decoded, normalized request inputs without changing forwarded traffic.
- slug: ro3
  name: Score attack signals
  difficulty: medium
  marketing_md: In this stage, you'll combine weighted attack signals into one request score.
- slug: xd5
  name: Add ML detection
  difficulty: medium
  marketing_md: In this stage, you'll call an ML detector and enforce a policy cutoff on its score.
- slug: si3
  name: Tune detection decisions
  difficulty: medium
  marketing_md: In this stage, you'll combine rule and ML scores using thresholds for each application route.
- slug: qe5
  name: Inspect request bodies
  difficulty: medium
  marketing_md: In this stage, you'll inspect structured request bodies within a strict size limit.
- slug: as4
  name: Prevent response leaks
  difficulty: hard
  marketing_md: In this stage, you'll withhold responses that expose a protected pattern or exceed the inspection limit.
- slug: mu9
  name: Virtually patch an endpoint
  difficulty: hard
