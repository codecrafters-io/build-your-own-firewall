hints:
  - title_markdown: How do I keep the detector deadline and fallback correct?
    body_markdown:
      Use an opener with redirects disabled and timeout=0.2 when opening the
      detector request. Validate the complete JSON reply, require type(score) is
      int to exclude booleans, then check the range. Catch HTTP, transport,
      timeout, and parsing errors and leave the ML score absent on failure.
