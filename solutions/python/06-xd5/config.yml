hints:
  - title_markdown: "How do I classify the conversation?"
    body_markdown: |-
      Loop over the original message objects and send each one to `/classify`.
      You can make these calls sequentially. Store scores in message order and
      use their maximum for this stage, or zero for an empty conversation.
      Keep the original request bytes for forwarding and do not copy the
      origin's Authorization header into classifier requests.
  - title_markdown: "How do I handle an invalid or unavailable score?"
    body_markdown: |-
      Pass timeout=0.2 to the classifier HTTP request. Require HTTP 200 and parse
      the response JSON. Check type(score) is int and 0 <= score <= 100.
      Treat HTTP, timeout, and JSON errors as unavailable classification.
      If any message fails, discard classifier scores and retain the earlier
      denylist and heuristic decision. Report unavailable without a score header.
