hints:
  - title_markdown: Which decoding and Unicode functions should I use?
    body_markdown:
      Split the raw path from the query first. Use urllib.parse.unquote for path
      components, replacing plus with space only for form/query components.
      Reject malformed percent escapes before decoding and use strict UTF-8.
      Then apply unicodedata.normalize("NFKC", value).casefold() to inspection
      copies. HTTP/1 header bytes are exposed as Latin-1 strings by http.server.
      For configured UTF-8 textual headers, re-encode the inspection copy as
      Latin-1, then decode UTF-8; keep the original header for forwarding.
