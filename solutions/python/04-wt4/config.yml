hints:
  - title_markdown: "How do I normalize each message?"
    body_markdown: |-
      First remove the policy's zero-width characters with `str.replace`. Then
      use `unicodedata.normalize("NFKC", text).casefold()`. Map the result with
      `"".join(mapping.get(character, character) for character in text)`.
      `casefold` turns sharp s into `ss`, while `lower` does not.
  - title_markdown: "When should I decode base64?"
    body_markdown: |-
      Decode the original message with `base64.b64decode(text, validate=True)`
      and decode those bytes as UTF-8, without re-encoding to compare. Inspect a
      normalized copy of that result alongside the normalized original, catching
      decoding errors. Don't feed the result back into the decoder. Keep the
      original JSON bytes for forwarding.
