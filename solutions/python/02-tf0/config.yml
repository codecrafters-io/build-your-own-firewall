hints:
  - title_markdown: How do I preserve traffic while proxying?
    body_markdown:
      Use urllib.request.Request with the original method and raw body. Catch
      HTTPError as a readable origin response instead of converting it to 502.
      Catch http.client.HTTPException too, including IncompleteRead, and return
      the prescribed 502 if the complete origin response cannot be read. Build
      an opener with an empty ProxyHandler and a redirect handler that does not
      follow redirects. Copy the required headers and recalculate
      Content-Length.
