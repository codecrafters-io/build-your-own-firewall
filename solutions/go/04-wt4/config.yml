hints:
  - title_markdown: "How do I normalize Unicode in Go?"
    body_markdown: |-
      The starter includes `golang.org/x/text@v0.32.0` for Go 1.25. First remove
      the policy's zero-width characters with `strings.ReplaceAll`. Then use
      `norm.NFKC.String(text)` from `golang.org/x/text/unicode/norm`, then
      `cases.Fold().String(text)` from `golang.org/x/text/cases`, and map each
      rune through the homoglyph table. `strings.ToLower` does not implement
      full case folding.
  - title_markdown: "How do I inspect base64 without rewriting the request?"
    body_markdown: |-
      Keep your original request bytes and build separate inspection strings.
      Try `base64.StdEncoding.DecodeString` on each original message and check
      `utf8.Valid` on the decoded bytes. Don't re-encode to compare; accept
      whatever the decoder accepts. Normalize the decoded text once too.
      Inspect both candidates and forward the untouched request body when allowed.
