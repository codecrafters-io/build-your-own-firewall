hints:
  - title_markdown: "How do I forward requests in Go?"
    body_markdown: |-
      Parse the origin URL with `url.Parse` and create an
      [`httputil.ReverseProxy`](https://pkg.go.dev/net/http/httputil#ReverseProxy).
      Set its `Rewrite` function to call `request.SetURL(target)`, which adjusts
      both the URL and the outgoing host. Register its `ServeHTTP` method for
      `/v1/chat/completions`, keeping your health handler separate.
  - title_markdown: "How do I preserve JSON and handle origin failures?"
    body_markdown: |-
      Pass the request to the reverse proxy without decoding its body. This keeps
      conversation history and optional fields intact. The proxy relays origin
      error responses and returns HTTP 502 when it cannot reach the origin.
      Read the `--origin` flag rather than hardcoding the tester's port.
