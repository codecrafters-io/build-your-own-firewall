name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_course_definition:
    uses: codecrafters-io/course-sdk/.github/workflows/test-course-definition.yml@0cfc1aa8b61489e812b8d860e504f4e221df790d
    with:
      sdkRef: 0cfc1aa8b61489e812b8d860e504f4e221df790d
    permissions:
      contents: read
      checks: write
      pull-requests: write
    secrets: inherit
